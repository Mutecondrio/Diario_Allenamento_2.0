<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario allenamento</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b78">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf0;--card:#fff;--ink:#17262f;--mute:#5d6d77;--line:#cfd8dd;--acc:#0e6b78;--accT:#fff;--amb:#c98a0c;--in:#f2f5f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--card:#19252c;--ink:#e6eef2;--mute:#8fa2ad;--line:#2b3b44;--acc:#4cc2d1;--accT:#08171b;--amb:#f0b73a;--in:#111b20}}
:root[data-theme="dark"]{--bg:#10181d;--card:#19252c;--ink:#e6eef2;--mute:#8fa2ad;--line:#2b3b44;--acc:#4cc2d1;--accT:#08171b;--amb:#f0b73a;--in:#111b20}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0 8px}
h1{font:700 28px/1 "Barlow Condensed",Impact,sans-serif;margin:0}
input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;z-index:2}
nav button{flex:0 0 auto;font:600 15px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
nav button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sub{color:var(--mute);margin:2px 0 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grp{border-left:4px solid var(--amb);padding-left:10px;margin-bottom:10px}
.grp>.gl{font:700 17px "Barlow Condensed",sans-serif;color:var(--amb)}
.grp>.gn{font-size:13px;color:var(--mute);margin-bottom:6px}
.grp .card{margin-bottom:8px}
.t{font:700 20px/1.1 "Barlow Condensed",sans-serif;margin:0}
.m{font-size:13px;color:var(--mute);margin:3px 0 8px}
.m b{color:var(--ink)}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row .n{width:20px;color:var(--mute);font-weight:600}
.row input{width:76px;font:600 18px Barlow,sans-serif;text-align:center;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.row span.u{color:var(--mute);font-size:13px;margin-right:8px}
.last{font-size:13px;color:var(--mute);margin-top:6px}
.cp{font:600 13px Barlow,sans-serif;color:var(--acc);background:none;border:1px solid var(--acc);border-radius:8px;padding:5px 10px;margin-top:8px}
.prog{font:600 14px Barlow,sans-serif;color:var(--acc)}
select{width:100%;font:600 16px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.h{flex-wrap:wrap;display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.h:first-child{border-top:0}
.h .d{color:var(--mute);min-width:52px}
.h .s{flex:1;text-align:right}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}.tb th,.tb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;white-space:nowrap}.tb td:first-child{white-space:normal;min-width:120px}.tb th{color:var(--mute);font-weight:600}.tb small{color:var(--mute)}
#tm{display:none;position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding:10px 14px;background:var(--acc);color:var(--accT);align-items:center;gap:10px;z-index:25;box-shadow:0 -4px 18px rgba(0,0,0,.18)}
#tm #tt{font:700 44px/1 "Barlow Condensed",sans-serif;flex:1}
#tm button{font:600 15px Barlow,sans-serif;background:transparent;color:var(--accT);border:1px solid var(--accT);border-radius:8px;padding:8px 12px}
.cp:disabled{opacity:.4}
.section-title{font:700 20px "Barlow Condensed",sans-serif;margin:16px 0 6px}
.hvnav button{padding:8px 2px;font-size:14px}
select.cp option{color:var(--ink);background:var(--card)}
.ex{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}.ei{width:100%;font:500 15px Barlow,sans-serif;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:8px;padding:8px}.er{display:flex;gap:6px}.er label{flex:1;min-width:0;font-size:12px;color:var(--mute)}.er .cp{flex:1;margin:0}
.pr{color:var(--acc);font-weight:600}

/* UX 2.0 */
.appbar{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);padding-top:4px}
header{padding:12px 0 8px}
header .head-left{min-width:0} header .today-label{font-size:12px;color:var(--mute);margin-top:2px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.bottom-nav button{flex:1;max-width:180px;border:0;background:transparent;color:var(--mute);font:600 12px Barlow,sans-serif;border-radius:12px;padding:7px 4px}
.bottom-nav button .ico{display:block;font-size:20px;line-height:20px;margin-bottom:2px}
.bottom-nav button.on{background:var(--in);color:var(--acc)}
.hero{background:linear-gradient(135deg,var(--card),var(--in));border:1px solid var(--line);border-radius:16px;padding:18px;margin:8px 0 12px}
.hero h2{font:700 30px/1 "Barlow Condensed",sans-serif;margin:0 0 4px}
.hero .meta{color:var(--mute);font-size:14px}
.primary{width:100%;font:700 18px Barlow,sans-serif;border:0;border-radius:12px;padding:14px;background:var(--acc);color:var(--accT);margin-top:14px;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.secondary{width:100%;font:600 15px Barlow,sans-serif;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--card);color:var(--ink)}
.day-picker{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 10px;margin-bottom:4px}
.day-picker button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:600 14px Barlow,sans-serif}
.day-picker button.on{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.quick b{display:block;font-size:21px}.quick span{color:var(--mute);font-size:12px}
.danger{color:#b33;background:none;border:1px solid #b33}
.finish{position:sticky;bottom:86px;z-index:6;margin:12px 0}
/* Schermata palestra */
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.gtarget{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gtarget b{font:700 30px/1 "Barlow Condensed",sans-serif}
.gtarget span{color:var(--mute);font-size:13px}
.gsug{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.gsug small{display:block;color:var(--mute);font-size:12px}
.gsug b{font:700 26px/1.1 "Barlow Condensed",sans-serif}
.gsug .big{color:var(--acc)}
.gset{display:grid;grid-template-columns:30px 1fr 1fr 66px;gap:8px;align-items:center;margin:10px 0 2px}
.gset .gnum{font:700 26px "Barlow Condensed",sans-serif;color:var(--mute);text-align:center}
.gset .gf{position:relative}
.gset input{width:100%;height:72px;font:700 44px/1 "Barlow Condensed",sans-serif;text-align:center;color:var(--ink);background:var(--in);border:2px solid var(--line);border-radius:14px;padding:0 4px}
.gset input::placeholder{color:var(--mute);opacity:.55}
.gset .gf small{position:absolute;right:8px;bottom:4px;font-size:11px;color:var(--mute);pointer-events:none}
.gset .gok{height:72px;font:700 30px sans-serif;border-radius:14px;border:2px solid var(--acc);background:transparent;color:var(--acc)}
.gset.ok .gok{background:var(--acc);color:var(--accT)}
.gset.ok input{border-color:var(--acc)}
.gprev{font-size:12px;color:var(--mute);margin:0 0 2px 38px}
.gdrop{margin-left:38px}
.gact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gact .secondary{padding:14px;font-size:16px}
.gtool{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gtool .cp{margin:0}
details.gx{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.gx summary{font:600 14px Barlow,sans-serif;color:var(--acc);padding:6px 0}
@media(max-width:380px){.quick-grid{grid-template-columns:1fr}.hero h2{font-size:27px}}
</style></head><body><div class="wrap">
<div class="appbar"><header><div class="head-left"><h1 id="ttl">Diario allenamento</h1><div class="today-label" id="dateLabel"></div></div><input type="date" id="dt" aria-label="Data allenamento"></header></div>
<nav id="nav"></nav><main id="main"></main></div>
<div id="tm"><span id="tt">0:00</span><button data-t="30">+30"</button><button data-t="stop">Stop</button></div>
<script>
const E=(id,n,m,s,r,o={})=>Object.assign({id,n,m,s,r},o);
let DAYS=[
{t:'Giorno 1',d:'Petto e bicipiti',it:[
 E('e2','Chest press','Pettorali',3,'7/9',{rec:'120-180"',h:90}),
 E('e3','Curl bilanciere angolato','Bicipiti',3,'7/9',{rec:'120-180"',h:12.5,nt:'12,5 per lato'}),
 E('e4','Croci ai cavi alti','Pettorali',3,'8/10',{rec:'120-180"',h:10,nt:'Seduto su panca a 75°, 10 con altezza 14'}),
 {g:'Tri-set',gn:'1 min tra gli esercizi, 2 min a fine giro',it:[
  E('e6','Curl con manubri su panca','Bicipiti',2,'7/11',{rec:'60"',h:12}),
  E('e7','Distensione manubri su panca inclinata','Pettorali',2,'7/10',{rec:'60"',h:22,nt:'Panca a 30°'}),
  E('e8','Curl ai cavi bassi, braccio singolo','Bicipiti',2,'7/11',{rec:'60"',h:15})]}]},
{t:'Giorno 2',d:'Gambe e spalle',it:[
 E('e10','Calf press','Polpacci',2,'7/11',{rec:'120"'}),
 E('e11','Squat multipower','Quadricipiti',3,'7/9',{rec:'120-180"'}),
 E('e12','Lento avanti con bilanciere alla Smith','Spalle',3,'7/10',{rec:'120-180"'}),
 E('e13','Adductor','Adduttori, glutei',3,'7/11',{rec:'120-180"'}),
 {g:'Jumpset',gn:'1 min tra gli esercizi, 2 min a fine giro',it:[
  E('e15','Alzate laterali da seduto','Spalle',3,'6/10',{rec:'60"'}),
  E('e16','Aperture ai cavi','Spalle',3,'7/11',{rec:'60"'})]}]},
{t:'Giorno 3',d:'Tricipiti e dorso',it:[
 E('e18','French press ai cavi bassi, sdraiato su panca','Tricipiti',3,'7/9',{rec:'120-180"'}),
 E('e19','Lat machine singola','Dorsali',2,'7/9',{rec:'120-180"'}),
 E('e20','Push down ai cavi alti, barra triangolo','Tricipiti',3,'8/11',{rec:'120-180"'}),
 E('e21','Spinte su rialzo a gambe flesse','Tricipiti',2,'max',{rec:'120"'}),
 {g:'Super-set',gn:'2 serie da 7/11, ultima serie al max con scrollate · rec 120-180"',it:[
  E('e23','Rematore due manubri','Bicipiti, dorsali',2,'7/11',{rec:'120-180"',nt:'Panca a 30°, gomiti stretti'}),
  E('e24','Rematore due manubri','Bicipiti, dorsali',2,'7/11',{rec:'120-180"',nt:'Panca a 30°, gomiti larghi'})]}]},
{t:'Giorno 4',d:'Bicipiti, petto e gambe',it:[
 E('e26','Curl manubri martello su panca','Bicipiti',3,'7/9',{rec:'120-150"'}),
 E('e27','Curl bilanciere su preacher curl','Bicipiti',3,'7/11',{rec:'120-180"',nt:'Su pressa a 45°'}),
 E('e28','Distensione manubri su panca inclinata','Pettorali',2,'7/10',{rec:'120"',nt:'Panca a 45°'}),
 E('e29','Pectoral rear machine','Pettorali',3,'8/10',{rec:'120-180"'}),
 E('e30','Leg extension','Quadricipiti',3,'7/10',{rec:'120-180"'}),
 E('e31','Stacchi a gambe tese','Femorali',2,'6/9',{rec:'120-180"'})]},
{t:'Giorno 5',d:'Spalle, dorso e tricipiti',it:[
 E('e33','Shoulder press','Spalle',3,'7/10',{rec:'120-180"'}),
 E('e34','Alzate laterali ai cavi','Spalle',3,'7/11',{rec:'120-180"'}),
 E('e35','Trazioni presa larga alle parallele','Dorsali',3,'7/11',{rec:'120-180"',nt:'Zavorrate'}),
 E('e36','Pulley con presa larga','Dorsali',3,'6/9',{rec:'120-180"'}),
 E('e37','French press verticale con kettlebell','Spalle, tricipiti',3,'7/11',{rec:'120-180"',nt:'Seduto su panca a 45° con manubrio'}),
 E('e38','Push down ai cavi alti, braccio singolo','Tricipiti',2,'8/10',{rec:'120"'})]}];
const flat=d=>d.it.flatMap(x=>x.g?x.it:[x]);
let ALL,GL,GM;
function gp(x,k){const v=parseInt(x[k]);return isNaN(v)?null:v}
function hasGP(x){return !!x&&(gp(x,'p1')!==null||gp(x,'p2')!==null)}
function fm(v){return v<60?v+' sec':Math.floor(v/60)+' min'+(v%60?' '+v%60+' sec':'')}
function pauseTxt(x){const a=gp(x,'p1'),b=gp(x,'p2'),r=[];if(a!==null)r.push((a===0?'nessuna pausa':fm(a))+' tra gli esercizi');if(b!==null)r.push((b===0?'nessuna pausa':fm(b))+' a fine giro');return r.length?'Pausa: '+r.join(', '):''}
function gtxt(x){return [x.gn,pauseTxt(x)].filter(Boolean).join(' · ')}
function inG(e){const m=GM&&GM[e.id];return !!m&&hasGP(m.g)}
function restFor(e){const m=GM&&GM[e.id];if(m&&hasGP(m.g)){return gp(m.g,m.last?'p2':'p1')}return null}
function restBtn(e){let r=restFor(e);if(r===0)return '<div class="last">Nessuna pausa: passa subito al prossimo esercizio del gruppo.</div>';if(r===null)r=parseInt(e.rec)||90;
 return `<button class="cp" data-rest="${r}">⏱ Recupero ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}</button> `}
const mig=p=>{p.forEach(d=>d.it.forEach(x=>{if(x.g==='Sup-set')x.g='Super-set';if(x.g&&x.p1===undefined&&x.p2===undefined){const m=String(x.gn).match(/(\d+)\s*min tra gli esercizi,\s*(\d+)\s*min a fine giro/);if(m){x.p1=+m[1]*60;x.p2=+m[2]*60;x.gn=x.gn.replace(m[0],'').replace(/^[\s·,:]+|[\s·,:]+$/g,'')}}}));return p};
mig(DAYS);
const PK='diario-fitclub-plan-v1';const DEF=JSON.stringify(DAYS);
const noAb=p=>p.filter(d=>!(d.t==='Addome'&&d.it.length===1&&d.it[0].id==='ab'));
try{const p=JSON.parse(localStorage.getItem(PK));if(Array.isArray(p)&&p.length)DAYS=mig(noAb(p))}catch(e){}
let DUR={a:'',b:''};try{Object.assign(DUR,JSON.parse(localStorage.getItem('diario-fitclub-dur-v1'))||{})}catch(e){}
const saveDur=()=>{try{localStorage.setItem('diario-fitclub-dur-v1',JSON.stringify(DUR))}catch(e){}};
let ARCH=[];try{ARCH=JSON.parse(localStorage.getItem('diario-fitclub-arch-v1'))||[];if(!Array.isArray(ARCH))ARCH=[]}catch(e){}
const saveArch=()=>{try{localStorage.setItem('diario-fitclub-arch-v1',JSON.stringify(ARCH))}catch(e){}};
let NAME='';try{NAME=localStorage.getItem('diario-fitclub-name-v1')||''}catch(e){}
let AR=true;try{AR=localStorage.getItem('diario-fitclub-ar-v1')!=='0'}catch(e){}
const saveName=()=>{try{localStorage.setItem('diario-fitclub-name-v1',NAME)}catch(e){}};
const applyName=()=>{document.querySelector('#ttl').textContent=NAME||'Diario allenamento';document.title=NAME||'Diario allenamento'};
const savePlan=()=>{try{localStorage.setItem(PK,JSON.stringify(DAYS))}catch(e){}};
function rebuild(){ALL=DAYS.flatMap(d=>flat(d).map(e=>({...e,day:d.t})));GL={};GM={};DAYS.forEach(d=>d.it.forEach(x=>{if(x.g)x.it.forEach((y,j)=>{GL[y.id]={g:x.g,t:gtxt(x)};GM[y.id]={g:x,last:j===x.it.length-1}})}))}rebuild();
function findEx(id){for(const d of DAYS)for(let i=0;i<d.it.length;i++){const x=d.it[i];if(x.id===id)return{arr:d.it,i,d};if(x.g)for(let j=0;j<x.it.length;j++)if(x.it[j].id===id)return{arr:x.it,i:j,d,g:x,gi:i}}}

 $('#main').innerHTML=tg+(S.hv==='date'?day():S.hv==='vol'?vol():S.hv==='body'?body():S.hv==='cal'?cal():S.hv==='arch'?archList():day())+'<div><button class="cp" id="sh">Condividi / copia riepilogo</button><p class="sub" id="msg"></p></div><div class="card"><h2 class="t">Backup dati</h2><p class="m">Copia il backup e conservalo in una nota. Se perdi i dati, incollalo qui e tocca Ripristina.</p><button class="cp" id="bk">Crea backup</button> <button class="cp" id="rs">Ripristina</button><textarea id="bkt" rows="4" aria-label="Backup" style="width:100%;margin-top:10px;font:12px monospace;background:var(--in);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea><p class="sub" id="bmsg"></p></div>'}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.dur){setDur(t);return}if(t.dataset.pn){NAME=t.value.slice(0,40);saveName();applyName();return}
 if(t.dataset.nt){const D=L[S.date]=L[S.date]||{};(D._nt=D._nt||{})[t.dataset.nt]=t.value.slice(0,500);save();return}
 if(t.dataset.dlp!==undefined){t.value=t.value.replace(/\D/g,'').slice(0,2);const D=L[S.date]=L[S.date]||{};D._tpp=t.value||'20';save();return}
 if(t.dataset.k){editIn(t);return}
 if(t.dataset.wu||t.dataset.body){t.value=(t.dataset.f==='reps')?t.value.replace(/\D/g,'').slice(0,3):t.value.replace(/[^0-9.,]/g,'').slice(0,6);const D=L[S.date]=L[S.date]||{};
  if(t.dataset.wu){const o=(D._wu=D._wu||{});(o[t.dataset.wu]=o[t.dataset.wu]||{})[t.dataset.f]=t.value}else{(D._body=D._body||{})[t.dataset.body]=t.value}save();return}if(!t.dataset.id)return;
 t.value=t.dataset.f==='kg'?t.value.replace(/[^0-9.,]/g,'').slice(0,6):t.value.replace(/\D/g,'').slice(0,3);
 const a=(L[S.date]=L[S.date]||{})[t.dataset.id]=L[S.date][t.dataset.id]||[];
 const i=+t.dataset.i;a[i]=a[i]||{};const old=a[i].kg||'';if(t.dataset.d){const kk='d'+t.dataset.d;(a[i][kk]=a[i][kk]||{})[t.dataset.f]=t.value.trim()}else a[i][t.dataset.f]=t.value.trim();
 if(i===0&&t.dataset.f==='kg'&&!t.dataset.d){document.querySelectorAll('input[data-f="kg"][data-id="'+t.dataset.id+'"]:not([data-d])').forEach(x=>{const j=+x.dataset.i;if(j>0&&(x.value===''||x.value===old)){x.value=t.value.trim();a[j]=a[j]||{};a[j].kg=x.value}})}
 save();prog();const st=$('#st-'+t.dataset.id);if(st)st.innerHTML=statHtml(t.dataset.id)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.dur){setDur(t);return}if(t.dataset.ng!==undefined){if(GP[t.value]){DAYS[+t.dataset.ng].it.push({g:t.value,gn:GP[t.value],p1:PP[t.value][0],p2:PP[t.value][1],it:[]});savePlan();rebuild();edit()}return}
 if(t.dataset.gt){const[a,b]=t.dataset.gt.split(':').map(Number),g=DAYS[a].it[b];if(g&&g.it&&GP[t.value]){const pv=GT[g.g],nv=GT[t.value];g.g=t.value;g.gn=GP[t.value];g.p1=PP[t.value][0];g.p2=PP[t.value][1];if(nv)g.it.forEach(x=>x.tc=nv);else if(pv)g.it.forEach(x=>x.tc='');savePlan();rebuild();edit()}return}
 if(t.dataset.rpe){const D=L[S.date]=L[S.date]||{},o=(D._rpe=D._rpe||{});if(t.value)o[t.dataset.rpe]=t.value;else delete o[t.dataset.rpe];save()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab!==undefined){S.tab=/^\d+$/.test(b.dataset.tab)?+b.dataset.tab:b.dataset.tab;S.gi=0;S.cf=null;render()}
 else if(b.dataset.pickday!==undefined){S.tab=+b.dataset.pickday;S.guide=false;S.gi=0;render()}
 else if(b.dataset.start!==undefined){S.tab=+b.dataset.start;S.guide=true;S.gi=0;S.workoutStart=S.workoutStart||Date.now();render()}
 else if(b.dataset.finish){const mins=S.workoutStart?Math.max(1,Math.round((Date.now()-S.workoutStart)/60000)):0;const D=L[S.date]=L[S.date]||{};if(mins)D._duration=mins;save();S.workoutStart=null;S.guide=false;S.tab='O';render();alert(mins?'Allenamento salvato: '+mins+' min.':'Allenamento salvato.')}
 else if(b.dataset.ea){editAct(b)}
 else if(b.dataset.mk!==undefined){setMark(S.date,b.dataset.mk,(L[S.date]||{})._tpp);hist()}
 else if(b.dataset.mkw){const D=L[S.date]||{},st=new Date(wk(S.date)+'T12:00:00');for(let i=0;i<7;i++){const x=new Date(st);x.setDate(st.getDate()+i);setMark(x.toLocaleDateString('sv'),D._tp||'',D._tpp)}hist()}
 else if(b.dataset.mv){const f=S.date,t=$('#mvd').value;if(t&&t!==f&&L[f]){L[t]=Object.assign(L[t]||{},L[f]);delete L[f];save();S.date=t;S.auto=t===today();$('#dt').value=t;render()}}
 else if(b.dataset.gd){S.guide=!S.guide;S.gi=0;render()}
 else if(b.dataset.gn){S.gi=(S.gi||0)+ +b.dataset.gn;render();scrollTo(0,0)}
 else if(b.dataset.hv){S.hv=b.dataset.hv;hist()}
 else if(b.dataset.rest){startT(+b.dataset.rest)}
 else if(b.dataset.arch){if(S.cf!=='arch'){S.cf='arch';edit();return}S.cf=null;const A=DUR.a,Z=DUR.b,lg={};
  Object.keys(L).sort().forEach(d=>{if((!A||d>=A)&&(!Z||d<=Z)&&Object.keys(L[d]).length)lg[d]=JSON.parse(JSON.stringify(L[d]))});
  ARCH.unshift({id:Date.now().toString(36),name:NAME||'Scheda',a:A,b:Z,at:today(),plan:JSON.parse(JSON.stringify(DAYS)),logs:lg});saveArch();edit();alert('Scheda archiviata. La trovi in Storico → Schede.')}
 else if(b.dataset.ao){S.ao=S.ao===b.dataset.ao?null:b.dataset.ao;hist()}
 else if(b.dataset.adel){const k='a'+b.dataset.adel;if(S.cf!==k){S.cf=k;hist();return}ARCH=ARCH.filter(a=>a.id!==b.dataset.adel);saveArch();S.cf=null;hist()}
 else if(b.dataset.ok){const id=b.dataset.ok,i=+b.dataset.i,e=ALL.find(q=>q.id===id);if(!e)return;
  const a=(L[S.date]=L[S.date]||{})[id]=L[S.date][id]||[],q=a[i]=a[i]||{};
  if(q.ok){delete q.ok;save();render();return}
  const p=prevSet(last(id),i);if(!q.kg){const v=dl(p.kg||e.h);if(v)q.kg=String(v)}if(!q.reps&&p.reps)q.reps=String(p.reps);
  if(!has(q))return;q.ok=1;save();const r=restSec(e);if(AR&&r>0)startT(r);render()}
 else if(b.dataset.addset){const D=L[S.date]=L[S.date]||{},xs=D._xs=D._xs||{};xs[b.dataset.addset]=(+xs[b.dataset.addset]||0)+1;save();render()}
 else if(b.dataset.rmset){const id=b.dataset.rmset,e=ALL.find(q=>q.id===id),D=L[S.date]||{},xs=D._xs=D._xs||{},a=D[id]||[],n=setsN(e);if(n>e.s&&!has(a[n-1])){a.length=Math.min(a.length,n-1);xs[id]=Math.max(0,(+xs[id]||0)-1);save();render()}}
 else if(b.dataset.ar){AR=!AR;try{localStorage.setItem('diario-fitclub-ar-v1',AR?'1':'0')}catch(x){}render()}
 else if(b.dataset.t){if(b.dataset.t==='stop'){clearInterval(T.iv);T.iv=null;$('#tm').style.display='none'}else{T.end+=30000;if(!T.iv){T.iv=setInterval(tick,250)}tick()}}
 else if(b.id==='bk'){const t=JSON.stringify({v:4,logs:L,plan:DAYS,name:NAME,dur:DUR,arch:ARCH});const ta=$('#bkt');ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(x){}$('#bmsg').textContent=ok?'Backup copiato. Incollalo in una nota o in una chat con te stesso.':'Tieni premuto sul testo e scegli Copia, poi incollalo in una nota.'}
 else if(b.id==='rs'){try{const j=JSON.parse($('#bkt').value);const lg=j.logs||j;if(typeof lg!=='object'||Array.isArray(lg))throw 0;L=lg;save();if(Array.isArray(j.plan)&&j.plan.length){DAYS=mig(noAb(j.plan));savePlan();rebuild()}if(typeof j.name==='string'){NAME=j.name.slice(0,40);saveName();applyName()}if(j.dur&&typeof j.dur==='object'){DUR={a:String(j.dur.a||''),b:String(j.dur.b||'')};saveDur()}if(Array.isArray(j.arch)){ARCH=j.arch;saveArch()}$('#bmsg').textContent='Backup ripristinato.'}catch(x){$('#bmsg').textContent='Testo non valido: incolla qui il backup completo.'}}
 else if(b.dataset.cp){const l=last(b.dataset.cp);if(l){(L[S.date]=L[S.date]||{})[b.dataset.cp]=JSON.parse(JSON.stringify(l.sets)).map(q=>{q.kg=dl(q.kg);delete q.ok;return q});save();render()}}
 else if(b.id==='sh'){
  const ds=Object.keys(L).sort().reverse();let t='';
  t=(NAME||'Diario allenamento').toUpperCase()+' (kg × ripetizioni)\n';
   ds.forEach(d=>{const rows=[];DAYS.forEach(D=>{const l=flat(D).filter(x=>dat(d,x.id));if(l.length)rows.push('\n'+D.t+' - '+D.d+'\n'+l.map(x=>'  '+x.n+(x.nt?' ('+x.nt+')':'')+': '+fmt(L[d][x.id]||[],x.tc)+(xtra(d,x.id,1).length?' ['+xtra(d,x.id,1).join(' · ')+']':'')).join('\n'))});
    if(rows.length)t+='\n=== '+d.split('-').reverse().join('/')+' ==='+rows.join('\n')+'\n'})
  try{if(navigator.share){navigator.share({title:'Diario allenamento',text:t}).catch(()=>{})}}catch(x){}
  let ta=$('#ta');if(!ta){ta=document.createElement('textarea');ta.id='ta';ta.readOnly=true;ta.rows=10;ta.style.cssText='width:100%;margin-top:10px;font:13px monospace;background:var(--in);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px';b.parentNode.append(ta)}
  ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(x){}
  $('#msg').textContent=ok?'Copiato negli appunti. Incolla dove vuoi.':'Tieni premuto sul testo qui sotto e scegli Copia.'}
});
$('#dt').value=S.date;
const today=()=>new Date().toLocaleDateString('sv');S.auto=true;
$('#dt').addEventListener('change',e=>{if(e.target.value){S.date=e.target.value;S.auto=S.date===today();render()}});

document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
try{window.addEventListener('focus',sync)}catch(x){}
setInterval(sync,60000);
applyName();S.tab='O';render();
