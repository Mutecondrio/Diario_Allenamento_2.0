<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario Palestra · V10 Workout Flow</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111512">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf0;--card:#fff;--ink:#17262f;--mute:#5d6d77;--line:#cfd8dd;--acc:#0e6b78;--accT:#fff;--amb:#c98a0c;--in:#f2f5f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--card:#19252c;--ink:#e6eef2;--mute:#8fa2ad;--line:#2b3b44;--acc:#4cc2d1;--accT:#08171b;--amb:#f0b73a;--in:#111b20}}
:root[data-theme="dark"]{--bg:#10181d;--card:#19252c;--ink:#e6eef2;--mute:#8fa2ad;--line:#2b3b44;--acc:#4cc2d1;--accT:#08171b;--amb:#f0b73a;--in:#111b20}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0 8px}
h1{font:700 28px/1 "Barlow Condensed",Impact,sans-serif;margin:0}
input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;z-index:2}
nav button{flex:0 0 auto;font:600 15px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
nav button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sub{color:var(--mute);margin:2px 0 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grp{border-left:4px solid var(--amb);padding-left:10px;margin-bottom:10px}
.grp>.gl{font:700 17px "Barlow Condensed",sans-serif;color:var(--amb)}
.grp>.gn{font-size:13px;color:var(--mute);margin-bottom:6px}
.grp .card{margin-bottom:8px}
.t{font:700 20px/1.1 "Barlow Condensed",sans-serif;margin:0}
.m{font-size:13px;color:var(--mute);margin:3px 0 8px}
.m b{color:var(--ink)}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row .n{width:20px;color:var(--mute);font-weight:600}
.row input{width:76px;font:600 18px Barlow,sans-serif;text-align:center;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.row span.u{color:var(--mute);font-size:13px;margin-right:8px}
.last{font-size:13px;color:var(--mute);margin-top:6px}
.cp{font:600 13px Barlow,sans-serif;color:var(--acc);background:none;border:1px solid var(--acc);border-radius:8px;padding:5px 10px;margin-top:8px}
.prog{font:600 14px Barlow,sans-serif;color:var(--acc)}
select{width:100%;font:600 16px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.h{flex-wrap:wrap;display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.h:first-child{border-top:0}
.h .d{color:var(--mute);min-width:52px}
.h .s{flex:1;text-align:right}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}.tb th,.tb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;white-space:nowrap}.tb td:first-child{white-space:normal;min-width:120px}.tb th{color:var(--mute);font-weight:600}.tb small{color:var(--mute)}
.gok{touch-action:manipulation}
.gset .gok:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.cp:disabled{opacity:.4}
.section-title{font:700 20px "Barlow Condensed",sans-serif;margin:16px 0 6px}
.hvnav button{padding:8px 2px;font-size:14px}
.cal-scroll{max-height:300px;overflow-y:auto;overflow-x:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--acc) var(--in)}
.cal-scroll::-webkit-scrollbar{width:10px;height:8px}
.cal-scroll::-webkit-scrollbar-track{background:var(--in);border-radius:8px}
.cal-scroll::-webkit-scrollbar-thumb{background:var(--acc);border-radius:8px;border:2px solid var(--in)}
.cal-scroll>div{min-width:300px}
.cal-scroll:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select.cp option{color:var(--ink);background:var(--card)}
.ex{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}.ei{width:100%;font:500 15px Barlow,sans-serif;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:8px;padding:8px}.er{display:flex;gap:6px;align-items:flex-start}.er label{flex:1 1 0;min-width:0;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}.er label input[type=date]{width:100%;min-width:0;max-width:100%;display:block;padding:8px 4px;font-size:13px;}.er .cp{flex:1;margin:0}
.pr{color:var(--acc);font-weight:600}

/* UX 2.0 */
.appbar{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);padding-top:4px}
header{padding:12px 0 8px}
header .head-left{min-width:0} header .today-label{font-size:12px;color:var(--mute);margin-top:2px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.bottom-nav button{flex:1;max-width:180px;border:0;background:transparent;color:var(--mute);font:600 12px Barlow,sans-serif;border-radius:12px;padding:7px 4px}
.bottom-nav button .ico{display:block;font-size:20px;line-height:20px;margin-bottom:2px}
.bottom-nav button.on{background:var(--in);color:var(--acc)}
.hero{background:linear-gradient(135deg,var(--card),var(--in));border:1px solid var(--line);border-radius:16px;padding:18px;margin:8px 0 12px}
.hero h2{font:700 30px/1 "Barlow Condensed",sans-serif;margin:0 0 4px}
.hero .meta{color:var(--mute);font-size:14px}
.primary{width:100%;font:700 18px Barlow,sans-serif;border:0;border-radius:12px;padding:14px;background:var(--acc);color:var(--accT);margin-top:14px;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.secondary{width:100%;font:600 15px Barlow,sans-serif;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--card);color:var(--ink)}
.day-picker{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 10px;margin-bottom:4px}
.day-picker button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:600 14px Barlow,sans-serif}
.day-picker button.on{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.quick b{display:block;font-size:21px}.quick span{color:var(--mute);font-size:12px}
.danger{color:#b33;background:none;border:1px solid #b33}
.progress-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.progress-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.progress-kpi>div{background:var(--in);border-radius:10px;padding:12px}.progress-kpi b{display:block;font:700 28px/1.1 "Barlow Condensed",sans-serif;color:var(--acc)}.progress-kpi span{font-size:12px;color:var(--mute)}.next-hint{border:1px solid var(--acc);border-radius:12px;padding:12px;background:var(--in);margin:10px 0}
.finish{position:sticky;bottom:86px;z-index:6;margin:12px 0}
/* Schermata palestra */
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.gtarget{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gtarget b{font:700 30px/1 "Barlow Condensed",sans-serif}
.gtarget span{color:var(--mute);font-size:13px}
.gsug{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.gsug small{display:block;color:var(--mute);font-size:12px}
.gsug b{font:700 26px/1.1 "Barlow Condensed",sans-serif}
.gsug .big{color:var(--acc)}
.gset{display:grid;grid-template-columns:30px 1fr 1fr 66px;gap:8px;align-items:center;margin:10px 0 2px}
.gset .gnum{font:700 26px "Barlow Condensed",sans-serif;color:var(--mute);text-align:center}
.gset .gf{position:relative}
.gset input{width:100%;height:72px;font:700 44px/1 "Barlow Condensed",sans-serif;text-align:center;color:var(--ink);background:var(--in);border:2px solid var(--line);border-radius:14px;padding:0 4px}
.gset input::placeholder{color:var(--mute);opacity:.55}
.gset .gf small{position:absolute;right:8px;bottom:4px;font-size:11px;color:var(--mute);pointer-events:none}
.gset .gok{height:72px;font:700 30px sans-serif;border-radius:14px;border:2px solid var(--acc);background:transparent;color:var(--acc)}
.gset.ok .gok{background:var(--acc);color:var(--accT)}
.gset.ok input{border-color:var(--acc)}
.gprev{font-size:12px;color:var(--mute);margin:0 0 2px 38px}
.gdrop{margin-left:38px}
.gact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gact .secondary{padding:14px;font-size:16px}
.gtool{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gtool .cp{margin:0}
details.gx{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.gx summary{font:600 14px Barlow,sans-serif;color:var(--acc);padding:6px 0}

.session-meter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.session-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.session-top strong{font:700 24px 'Barlow Condensed',sans-serif;color:var(--acc)}
.session-track{height:8px;background:var(--in);border-radius:99px;overflow:hidden;margin-top:10px}
.session-fill{height:100%;background:var(--acc);border-radius:99px;transition:width .2s ease}
.session-meta{font-size:12px;color:var(--mute);margin-top:7px}
.gnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.gnav button{min-height:48px;font-size:16px}
.gnav .next{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.gnav button:disabled{opacity:.35}
@media(max-width:420px){.session-meter{padding:12px}.session-top strong{font-size:22px}}


@media(max-width:520px){.card .er{flex-wrap:nowrap}.card .er button{min-height:40px}.card [data-ea="copyday"]{flex:1 1 120px}.card [data-dur]{min-width:0}.card .er label:has([data-dur]){flex:1 1 0;width:50%;}}

@media(max-width:380px){.quick-grid{grid-template-columns:1fr}.hero h2{font-size:27px}}

.progress-card .last{border-radius:12px;padding:11px;background:var(--in);border:1px solid var(--line)}
/* PREMIUM REDESIGN — antracite + verde lime; nessuna modifica alla logica o ai dati */
:root{color-scheme:dark;--bg:#101310;--card:#191e19;--ink:#edf3e9;--mute:#a0ada0;--line:#303a30;--acc:#b6f23b;--accT:#17200b;--amb:#f2b84b;--in:#202720}
:root[data-theme="dark"]{--bg:#101310;--card:#191e19;--ink:#edf3e9;--mute:#a0ada0;--line:#303a30;--acc:#b6f23b;--accT:#17200b;--amb:#f2b84b;--in:#202720}
:root[data-theme="light"]{color-scheme:light;--bg:#f0f3eb;--card:#ffffff;--ink:#20291d;--mute:#667160;--line:#d8dfd1;--acc:#78b817;--accT:#101a06;--amb:#a56b0b;--in:#e8eee1}
body{background:radial-gradient(ellipse at 50% -15%,rgba(182,242,59,.075),transparent 42%),var(--bg);letter-spacing:.005em}
.wrap{max-width:600px;padding-left:16px;padding-right:16px}
.appbar{background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
h1{letter-spacing:.015em;font-size:30px}
header{padding:14px 0 10px}
input[type=date],select,.row input,.ei{box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:border-color .15s,background .15s}
nav{padding-top:9px;padding-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar,.day-picker::-webkit-scrollbar{display:none}
nav button{border-radius:11px;padding:9px 13px;transition:background .15s,border-color .15s,transform .15s}
nav button.on,.day-picker button.on{box-shadow:0 0 0 1px rgba(182,242,59,.12),0 4px 16px rgba(182,242,59,.09)}
.card,.gcard,.progress-card,.quick,.session-meter{border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.card{padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 10%,var(--card)),var(--card) 70%);border-color:color-mix(in srgb,var(--acc) 28%,var(--line));box-shadow:0 8px 26px rgba(0,0,0,.12);padding:20px}
.hero h2{font-size:32px;letter-spacing:.01em}
.t,.section-title{letter-spacing:.015em}
.primary{border-radius:13px;box-shadow:0 5px 18px rgba(182,242,59,.12);transition:transform .12s,filter .12s}
.primary:active,.secondary:active,button:active{filter:brightness(.96)}
.secondary{border-radius:12px}
.cp{border-radius:10px;padding:7px 11px}
.bottom-nav{background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top-color:var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.22)}
.bottom-nav button{border-radius:12px;transition:background .15s,color .15s}
.bottom-nav button.on{background:color-mix(in srgb,var(--acc) 13%,var(--card));color:var(--acc)}
.gcard{padding:15px}
.gset input{border-radius:13px;background:var(--in);border-color:var(--line)}
.gset .gok{border-radius:13px;background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.gset.ok .gok{box-shadow:0 0 16px rgba(182,242,59,.15)}
.gtarget b,.gsug .big,.progress-kpi b{color:var(--acc)}
.progress-kpi>div{border:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
.next-hint{border-color:color-mix(in srgb,var(--acc) 50%,var(--line));border-radius:13px}
input:focus,select:focus,.ei:focus{border-color:var(--acc)!important}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media(max-width:420px){.wrap{padding-left:12px;padding-right:12px}.card{padding:12px}.hero{padding:17px}}

/* Recupero: appare solo dopo aver confermato una serie */
.rest-overlay{position:fixed;inset:0;z-index:9999;background:rgba(5,7,10,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px}
.rest-modal{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.rest-kicker{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--mute)}.rest-clock{font:800 64px/1 'Manrope',sans-serif;letter-spacing:-.06em;color:var(--acc);margin:18px 0 8px;font-variant-numeric:tabular-nums}.rest-track{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin:18px 0}.rest-track span{display:block;height:100%;width:100%;background:var(--acc);transition:width .25s linear}.rest-actions{display:flex;gap:8px}.rest-actions button{flex:1}


/* V9 ART DIRECTION — editorial fitness, graphite, acid-lime and electric violet */
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#0b0c10;--card:#14161d;--ink:#f4f4f0;--mute:#9699a8;--line:#292c38;--acc:#d7ff3f;--accT:#141906;--amb:#b9a0ff;--in:#1b1e27;color-scheme:dark}
:root[data-theme="dark"]{--bg:#0b0c10;--card:#14161d;--ink:#f4f4f0;--mute:#9699a8;--line:#292c38;--acc:#d7ff3f;--accT:#141906;--amb:#b9a0ff;--in:#1b1e27;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f2ed;--card:#fffefa;--ink:#191a20;--mute:#777986;--line:#dedee2;--acc:#9bc900;--accT:#111700;--amb:#7355d8;--in:#f0f0eb;color-scheme:light}
*{box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.55;letter-spacing:-.01em;background:radial-gradient(ellipse at 0% 0%,rgba(185,160,255,.13),transparent 32%),radial-gradient(ellipse at 100% 12%,rgba(215,255,63,.09),transparent 29%),var(--bg);background-attachment:fixed}
.wrap{max-width:680px;padding:0 18px 120px}
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
header{padding:19px 0 14px;gap:12px;align-items:center}
h1{font-size:clamp(25px,6vw,34px);font-weight:800;line-height:1.05;letter-spacing:-.065em;margin:0;background:linear-gradient(105deg,var(--ink) 30%,var(--acc) 95%);background-clip:text;-webkit-background-clip:text;color:transparent}
.today-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:800;margin-top:7px}
input,select,textarea,.ei{font-family:inherit;border-radius:13px!important;background:var(--in)!important;color:var(--ink)!important;border:1px solid var(--line)!important;transition:border-color .2s,box-shadow .2s,transform .2s}
input[type=date]{padding:10px;font-size:12px;max-width:150px}
nav{display:flex;gap:7px;padding:12px 0 15px;overflow-x:auto;scrollbar-width:none}
nav button,.bottom-nav button{font:800 11px/1.2 'Manrope',sans-serif;letter-spacing:.015em;border:1px solid transparent;border-radius:12px;padding:11px 14px;white-space:nowrap;transition:all .2s}
nav button{background:var(--card);color:var(--mute);border-color:var(--line)}
nav button.on{background:var(--acc);color:#11150a;border-color:var(--acc);box-shadow:0 5px 24px color-mix(in srgb,var(--acc) 20%,transparent)}
.card,.gcard,.progress-card,.quick,.session-meter{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,color-mix(in srgb,var(--card) 96%,white 4%),var(--card) 60%);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.card{padding:17px;margin-bottom:13px}.gcard{padding:17px;margin-bottom:13px}.progress-card{padding:18px;margin:12px 0}
.hero{padding:24px 21px;background:linear-gradient(130deg,#20232d 0%,#171922 55%,color-mix(in srgb,var(--acc) 12%,var(--card)) 100%);border:1px solid #343744;border-radius:25px;box-shadow:0 18px 42px rgba(0,0,0,.24)}
:root[data-theme="light"] .hero{background:linear-gradient(130deg,#242632,#343544 70%,#4c522e);color:#fff}
.hero:after{content:'TRAIN / TRACK / EVOLVE';position:absolute;right:-5px;bottom:8px;font-size:9px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.15);transform:rotate(-90deg);transform-origin:right bottom;pointer-events:none}
.hero h2{font-size:clamp(30px,7vw,42px);font-weight:800;line-height:1.02;letter-spacing:-.065em;max-width:85%;margin:0 0 12px}
.hero p,.hero .sub{color:#a9acb8}
.section-title,.t{font-weight:800;letter-spacing:-.035em}
.section-title{font-size:20px;margin:22px 2px 12px}
button{font-family:inherit;cursor:pointer;transition:transform .15s,filter .15s,background .2s,border-color .2s}
button:active{transform:scale(.97)}
.primary{background:var(--acc)!important;color:#15190c!important;border:0!important;border-radius:14px!important;padding:12px 17px;font-weight:900;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 16%,transparent)}
.secondary,.cp{background:var(--in)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:12px!important;padding:9px 12px;font-weight:800}
.cp{font-size:11px}
.gset{border-radius:17px!important;margin:9px 0!important;overflow:hidden}

function parsePlanOCR(text){
 const lines=String(text||'').replace(/\r/g,'\n').split(/\n+/).map(x=>x.replace(/[•·▪●]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const days=[];let current={t:'Giorno 1',d:'',it:[]};days.push(current);
 const isDay=x=>/^(giorno|day|workout|scheda|allenamento|seduta)\s*([a-z0-9]+)?\s*[:\-–.]?/i.test(x)||/^(A|B|C|D|E|F)\s*[:\-–.]\s*/i.test(x);
 const muscleHints=['petto','dorso','schiena','gambe','spalle','bicipiti','tricipiti','glutei','addominali','full body','upper','lower'];
 for(let raw of lines){let line=raw.replace(/^\d+[.)]\s*/,'').trim();if(!line)continue;
  if(isDay(line)){if(current.it.length||current.d){current={t:'Giorno '+(days.length+1),d:'',it:[]};days.push(current)}const m=line.match(/^(?:giorno|day|workout|scheda|allenamento|seduta)\s*([a-z0-9]+)?\s*[:\-–.]?\s*(.*)$/i);const ma=line.match(/^([A-F])\s*[:\-–.]\s*(.*)$/i);current.t=m?('Giorno '+(m[1]||days.length)):('Giorno '+(ma?ma[1]:days.length));current.d=((m&&m[2])||(ma&&ma[2])||'').trim();continue}
  // Recognize rows with prescriptions such as 3x8-10, 4 x 12, 3 serie da 10.
  const rx=line.match(/(?:\b(\d{1,2})\s*[x×]\s*(\d{1,3}(?:\s*[-–/]\s*\d{1,3})?|max|cedimento)\b)|(?:\b(\d{1,2})\s*serie\s*(?:da|x)\s*(\d{1,3}(?:\s*[-–/]\s*\d{1,3})?|max)\b)/i);
  let name=line,sets=3,reps='8/10';if(rx){sets=Math.max(1,Math.min(10,parseInt(rx[1]||rx[3])||3));reps=String(rx[2]||rx[4]||'8/10').replace(/\s/g,'').replace(/[–-]/g,'/');name=(line.slice(0,rx.index)+' '+line.slice(rx.index+rx[0].length)).replace(/[|,:;\-–]+$/,'').trim()}
  name=name.replace(/\s{2,}/g,' ').replace(/^[-–:|\s]+|[-–:|\s]+$/g,'');
  if(!name||name.length<3)continue;
  if(/^(recupero|rec|riposo|note|tempo|pausa|serie|ripetizioni)\b/i.test(name))continue;
  if(!rx && !/[a-zàèéìòù]{3}/i.test(name))continue;
  const lower=name.toLowerCase();if(!current.d&&muscleHints.some(h=>lower===h||lower.startsWith(h+' '))&&name.length<24){current.d=name;continue}
  current.it.push(E('x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,'',sets,reps,{rec:'120"'}));
 }
 const clean=days.filter(d=>d.it.length||d.d);if(!clean.length)throw new Error('Non sono riuscito a individuare esercizi nelle foto. Prova con immagini più nitide e ben illuminate.');
 clean.forEach((d,i)=>{if(!d.t)d.t='Giorno '+(i+1);if(!d.it)d.it=[]});return clean;
}
async function importPlanPhotos(files){const status=$('#photostatus');if(!files||!files.length)return;status.textContent='Avvio riconoscimento delle foto…';try{const T=await loadTesseract();const worker=await T.createWorker('ita');let all='';for(let i=0;i<files.length;i++){status.textContent='Leggo la foto '+(i+1)+' di '+files.length+'…';const r=await worker.recognize(files[i]);all+='\n'+(r.data.text||'')+'\n'}await worker.terminate();const plan=parsePlanOCR(all);const count=plan.reduce((n,d)=>n+d.it.length,0);if(!confirm('Ho riconosciuto '+plan.length+' giorno/i e '+count+' possibili esercizi. La scheda attuale verrà archiviata prima di sostituirla. Vuoi procedere?')){status.textContent='Importazione annullata. La scheda attuale non è stata modificata.';return}
 ARCH.unshift({id:Date.now().toString(36),name:NAME||'Scheda precedente',a:DUR.a||'',b:DUR.b||'',at:today(),plan:JSON.parse(JSON.stringify(DAYS)),logs:{}});saveArch();DAYS=plan;NAME='Nuova scheda';saveName();applyName();DUR={a:'',b:''};saveDur();savePlan();rebuild();S.cf=null;edit();const newStatus=$('#photostatus');if(newStatus)newStatus.textContent='Importazione completata: controlla i nomi e le prescrizioni riconosciute e correggi gli eventuali errori qui sotto.';scrollTo(0,0);
 }catch(err){status.textContent='Non sono riuscito a leggere le foto. Controlla che siano nitide e che ci sia connessione internet. Puoi anche caricare una foto alla volta. Dettaglio: '+(err&&err.message?err.message:'errore OCR')}}
function makeBackup(){return {format:'diario-allenamento-backup',v:6,createdAt:new Date().toISOString(),logs:L,plan:DAYS,name:NAME,dur:DUR,arch:ARCH}}
function restoreBackup(j){if(!j||typeof j!=='object'||Array.isArray(j))throw new Error('invalid');const lg=j.logs||j;if(typeof lg!=='object'||Array.isArray(lg))throw new Error('invalid logs');if(j.format&&j.format!=='diario-allenamento-backup')throw new Error('format');if(!confirm('Importare questo backup? I dati attualmente presenti su questo dispositivo verranno sostituiti. Ti consigliamo di esportare prima un backup attuale.'))return false;L=lg;save();if(Array.isArray(j.plan)&&j.plan.length){DAYS=mig(noAb(j.plan));savePlan();rebuild()}if(typeof j.name==='string'){NAME=j.name.slice(0,40);saveName();applyName()}if(j.dur&&typeof j.dur==='object'){DUR={a:String(j.dur.a||''),b:String(j.dur.b||'')};saveDur()}if(Array.isArray(j.arch)){ARCH=j.arch;saveArch()}return true}

let restInterval=null,restRemaining=0,restTotal=0,restPaused=false;

function showRest(seconds,exerciseName){closeRest();restTotal=Math.max(1,Math.round(seconds));restRemaining=restTotal;restPaused=false;
 const overlay=document.createElement('div');overlay.id='restOverlay';overlay.className='rest-overlay';overlay.innerHTML=`<div class="rest-modal" role="dialog" aria-modal="true" aria-label="Timer recupero"><div class="rest-kicker">RECUPERO</div><h2 style="margin:8px 0 0;font-size:22px">Respira. Recupera.</h2><div class="m" style="margin-top:5px">${esc(exerciseName||'Serie completata')}</div><div class="rest-clock" id="restClock">${fmtRest(restRemaining)}</div><div class="rest-track"><span id="restProgress"></span></div><div class="rest-actions"><button class="secondary" id="restPause">Pausa</button><button class="primary" id="restSkip">Fine recupero</button></div><div class="m" style="margin-top:12px">Il timer compare solo dopo aver confermato una serie.</div></div>`;
 document.body.appendChild(overlay);$('#restPause').addEventListener('click',()=>{restPaused=!restPaused;$('#restPause').textContent=restPaused?'Riprendi':'Pausa'});$('#restSkip').addEventListener('click',closeRest);restInterval=setInterval(()=>{if(restPaused)return;restRemaining--;const clock=$('#restClock'),bar=$('#restProgress');if(clock)clock.textContent=fmtRest(Math.max(0,restRemaining));if(bar)bar.style.width=(Math.max(0,restRemaining)/restTotal*100)+'%';if(restRemaining<=0){closeRest();try{if(navigator.vibrate)navigator.vibrate([150,80,150])}catch(e){}}},1000);
}
function fmtRest(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function restSeconds(e){const m=String(e&&e.rec||'').match(/\d+/);return m?Math.min(600,Math.max(5,+m[0])):90}
